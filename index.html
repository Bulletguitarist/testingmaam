["1. Why positive psychology was born","After the Second World War psychology mostly tried to <b>treat abnormal behaviour and mental illness</b>. Humanists (Maslow, Rogers, Fromm) were unhappy with this and revived interest in the good side of human nature. Seligman then made ‘build what is right, not only fix what is wrong’ the theme of his APA presidency: teach children and adults to use <b>strengths, not only fix weaknesses</b>. Mental health = more than absence of illness. PP is the <i>science of what makes humans well</i>; the rest of psychology is called ‘psychology as usual’ – not useless, just differently focused."],
["2. The first three waves in detail","<b>Disease model</b> (late 19th–early 20th c.): cured schizophrenia, inferiority/power complexes. Seligman’s 3 drawbacks: psychologists became victimologists (forgot choice and responsibility); forgot normal lives and high talent; never developed interventions to make people happier.<br><b>Behaviorism</b>: Skinner (Harvard) with Watson and Pavlov. Free will is an illusion; behaviour depends on consequences – reinforced behaviour repeats, punished behaviour fades. Merit: operant conditioning/reward systems. Criticism (Staddon): manipulation can be abused by dictators and bosses. Skinner: 21 books, 180 articles, voted most influential psychologist of the 20th century (2002).<br><b>Humanistic</b>: existential (Sartre – each person makes their own meaning, which brings existential anxiety; Frankl’s logotherapy) + humanistic (Maslow, Rogers). <b>5 principles</b>: humans are more than the sum of parts; live in a human context; are conscious and aware of being aware (always of self among others); can choose and so are responsible; are intentional – seek goals, meaning, value, creativity."],
["3. Founders & influencers","<b>William James</b> – first US psychology course; studied subjective experience, so called America’s first positive psychologist. <b>Maslow</b> – coined ‘positive psychology’ (1954); psychology shows our illnesses but not our virtues/aspirations. <b>Seligman</b> – learned helplessness → optimism; with Peterson built the ‘positive DSM’ (Character Strengths and Virtues); APA president; directs Penn PP Center. <b>Csikszentmihalyi</b> – wartime childhood, Italian camp; noticed painting’s act mattered more than product → flow. <b>Peterson</b> – Michigan; optimism, hope, character. <b>Bandura</b> – self-efficacy. <b>Clifton</b> – studied what top performers do right; ‘Father of strengths-based psychology’, APA commendation 2002. <b>Deci & Ryan</b> – SDT (2000): autonomy, competence, relatedness. <b>Diener</b> – ‘Dr Happiness’, SWB, 98,000+ citations, strong genetic component, income & culture studies. <b>Dweck</b> – growth vs fixed mindset."],
["4. Eastern traditions in detail","<b>Confucianism</b> (China, Confucius): morality is the cure for evil; welfare of others; virtues jen, yi, li, zhi, xin. <b>Taoism</b> (Lao-Tzu): Tao (‘Dow’) = the way, energy flowing through everything. Harmony of opposites – no light without dark. <b>Yin-yang</b>: two complementary forces (yang positive/masculine, yin negative/feminine), neither better, balance is desirable. Goals: naturalness, spontaneity; practise humanity, justice, temperance; the transcended person behaves virtuously without thinking about ‘optimal functioning’. <b>Buddhism</b>: 4 noble truths – life is suffering; suffering comes from ignorance, craving, attachment; it can end by overcoming ignorance; path = Eightfold Path. Brahma Viharas = universal virtues (maitri, karuna, mudita, upeksa); final goal Nirvana. <b>Hinduism</b>: Upanishads, interconnectedness of all things, after death either reincarnation or Nirvana (no rebirth, highest knowledge)."],
["5. East meets West","West seeks rewards in the physical plane; East seeks to transcend to the spiritual. <b>Value systems</b>: individualism (independence, stand out, self as unit) vs collectivism (dependence, conformity, group as unit). <b>Time</b>: East looks back to ancestors’ wisdom; West looks ahead (hope, optimism). <b>Thinking</b>: West = straight line to eternal happiness, obstacles to be avoided; East = circular, good and bad both matter, happiness = ‘end of unhappiness’. Western happiness (Laungani 2007) = self-esteem, confidence, comfort, success, respect, rights; constructs: <b>hope</b> and <b>need for uniqueness</b> (distinctiveness). <b>Common ground</b>: compassion (Aristotle, jen, karuna – looks beyond self) and harmony (diversity co-existing; Hindu interconnectedness). Table: West = individual growth, success, independent self, scientific, self-esteem/optimism/resilience, goal = flourishing & self-actualization (Aristotle, Seligman, Csikszentmihalyi). East = inner peace, balance/mindfulness, interconnected self, philosophical-spiritual, humility/gratitude/discipline, goal = spiritual growth & freedom from suffering (Confucius, Lao Tzu, Buddha, Hindu sages)."],
["6. Western religious approaches","<b>Athenian</b>: Plato, Socrates, Aristotle – moral virtues (courage, moderation, generosity, munificence, magnificence, even temper, friendliness, truthfulness, wit…). Government should develop virtue via early education; the polis helps ordinary people self-actualize; ordered life lifts one above hedonism; virtuous people model community; Aristotle – true happiness = virtuous, meaningful life, not pleasure alone. <b>Christianity</b>: Aquinas’ seven virtues (4 cardinal + faith, hope, charity); Ten Commandments; special value of wisdom. <b>Judaism</b>: Talmud, Pirke Avot – hospitality to poor, fair judgment, seeking peace. <b>Islam</b>: virtues as moral duties – gratitude, love of Allah, kindness to parents, justice, courage, altruism, zakat, patience; well-being = faith + righteous action + helping others. <b>Al-Ghazali</b> (1058–1111, Alchemy of Happiness): self-knowledge; heart is a mirror covered with dust of passions – polish it by moral discipline; higher faculties (reason) give more happiness than physical pleasure; prophets achieved union with Ultimate Reality; unhappiness = slavery to desire. <b>Al-Farabi</b> (sa’ada): happiness is the absolute good, desired for itself and the purpose of life; earthly happiness is necessary but secondary to supreme happiness in afterlife."]],
[
["1. Meaning & importance of well-being","Modern life is stressful, so health and well-being efforts span psychology, medicine, sociology, anthropology. Well-being includes happiness, energy, leisure, peace with oneself, contentment, sensitivity to the environment. It = satisfaction with life + positive affect (interest, love, surprise, pleasure) − negative affect (anxiety, depression, stress). It depends on <b>how you experience and interpret</b> conditions, not on wealth: money, property, power and prestige give only a limited sense of well-being, and unlimited growth in prosperity does not give proportionate life satisfaction."],
["2. Factors influencing well-being","<b>Nutrition</b>: balanced diet of carbs, proteins, fats, vitamins; skipping meals → weak, irritable; overeating → obesity and low self-esteem. <b>Exercise</b>: inactivity causes headache, BP, diabetes, backache, irritability, anxiety, depression; exercisers control stress better. <b>Sleep</b>: 8–9 hours, regular timing; deficiency → irritability, anxiety, depression, disturbed thinking. <b>Recreation</b>: personally important activities give joy. <b>Yoga & meditation</b>: discipline, peace, fitness. <b>Friends/relationships</b>: support, cooperation, enriching social life. <b>Optimism, resilience, hope</b>: healthier, happier, productive (resilience = strong in difficult times). <b>Routine</b>: structure, organisation, control, responsibility; helps convert bad habits to good. Principle: balance, avoid extremes."],
["3. SWB vs PWB","<b>Subjective well-being (Diener)</b>: positive emotions + life satisfaction – a hedonic view. <b>Psychological well-being (Ryff)</b> challenges it using six self-actualization constructs: autonomy, personal growth, purpose in life, self-acceptance, environmental mastery, positive relations with others."],
["4. Happiness","Emotional state of joy, satisfaction, contentment, fulfilment; psychologists say ‘subjective well-being’. <b>Two components</b>: balance of emotions (more positive than negative) and life satisfaction (relationships, work, achievements). Signs: living the life you wanted, good conditions, accomplishment, satisfaction, more positive than negative. Happy people still feel anger, sadness, boredom, loneliness but hold underlying optimism that they can cope and feel happy again. Smile is the typical facial expression."],
["5. Hedonic vs eudaimonic","<b>Hedonic</b> (pleasure; 4th c. BC; Hobbes, Bentham): maximize pleasure, minimize pain; self-care, enjoyment. Weakness: <b>hedonic adaptation</b> – after a party, meal or award we return to our baseline; fleeting pleasures give temporary mood lifts. <b>Eudaimonic</b> (Aristotle): live by virtue, meaning, purpose, responsibilities, long-term goals, others’ welfare; Maslow’s self-actualization is eudaimonic. Today = pleasure and meaning, plus <b>engagement</b>. Henderson et al.: hedonic acts raised positive emotion, life satisfaction and cut stress; eudaimonic acts raised meaning and ‘elevation’. Both are needed – a quick hedonic treat helps when sad, as eudaimonic effort is hard."],
["6. Set point & positive affect","<b>Lyubomirsky</b>: 50% genetics, 10% circumstances (birthplace, parents), 40% intentional activity – so over half is beyond our control. <b>Affect</b> = emotions we feel and show. Positive affectivity: cheerfulness, pride, enthusiasm, energy, joy; negative: sadness, disgust, lethargy, fear, distress. Affect influences opinions, thoughts, performance, even brain activity. Positive affect ≈ mood states (joy, interest, alertness); positive emotions include feelings plus physiological arousal, thoughts and behaviours. Measured by self-report e.g. <b>PANAS</b> (Positive and Negative Affect Schedule)."]],
[
["1. Optimism & hope","<b>Optimism</b> = expecting favourable outcomes, not denying problems. <i>Dispositional</i> (Scheier & Carver, expectancy-value) vs <i>learned</i> (Seligman, from learned helplessness). Explanatory style: <b>permanence</b> (‘always’ vs ‘this time’), <b>pervasiveness</b> (everything vs one area), <b>personalization</b> (all my fault vs several factors). Example: failed exam → ‘I will revise the topics I missed’ vs ‘I’m bad at everything’. <b>Hope (Snyder)</b> = goals + pathways (routes, alternatives) + agency (motivation to act). Hope cycle: set goal → find pathways → build agency → act and adapt (if one route fails, try another). Example: clear a competitive exam – timetable, practice tests, mentor. <b>Optimism vs hope vs self-efficacy</b>: ‘will things turn out well?’ vs ‘what can I do to reach my goal?’ vs ‘can I perform this task?’. Benefits: better coping, persistence, flexible problem-solving, well-being. Not a replacement for competence and effort."],
["2. Mindfulness","Attention to present-moment experience with openness, without instant judgement. Process: <b>notice → acknowledge → choose → redirect/act</b>. Myths: not empty mind, not constant calm, not passive acceptance, not a cure-all. <b>Kabat-Zinn</b>: intentional, non-judgmental awareness; <b>MBSR</b> = meditation, body scan, mindful movement, spotting stress reactions, responding deliberately. <b>Langer</b>: actively noticing novelty, context, alternatives. <b>MBCT</b> (Segal, Williams, Teasdale): mindfulness + cognitive therapy to prevent relapse of recurrent depression – see thoughts as mental events (‘I notice the thought that I always fail’). Practices: breath awareness, body scan, mindful walking, eating, listening, thought observation. Cautions: results vary, may feel uncomfortable, does not replace care."],
["3. Flow","Deep absorption (Csikszentmihalyi). <b>Challenge-skill</b>: too hard = anxiety; matched = flow; too easy = boredom. Characteristics: intense concentration, clear goals, immediate feedback, action–awareness merging, sense of control, altered time perception, reduced self-consciousness, autotelic (rewarding in itself). Conditions: manageable stretch, clear goals, feedback, focused time, meaningful task. Education: progressive challenge, clear learning goals, timely feedback. Mindfulness vs flow: mindfulness broadens awareness/non-reactivity; flow narrows attention to a task; they support each other (5-min anchor then focused 45-min block)."],
["4. Self-efficacy","Bandura’s social cognitive theory: belief in capability to organise and execute actions for a task; task-specific; not guarantee of success, not self-esteem (worth) or outcome expectation. Reciprocal determinism (behaviour–person–environment). Influences task choice, effort, persistence, emotions, recovery. <b>Four sources</b>: mastery (own success, small steps), vicarious (similar peers), social persuasion (credible, specific feedback), physiological/emotional states (reinterpret racing heart as readiness). Strengthen via realistic goals, practice, models, credible encouragement, anxiety reframing. Case: Riya ‘bad at statistics’ – split tasks, watch peer, specific feedback, reset routine."],
["5. Wisdom","Practical judgment using knowledge in complex, uncertain life situations; not equal to IQ, expertise or age. <b>Sternberg’s balance theory</b>: tacit knowledge balancing <b>intrapersonal, interpersonal, extrapersonal</b> interests for common good, and deciding to adapt, shape or select an environment. <b>Baltes (Berlin)</b>: expert knowledge of life’s pragmatics – life planning, management, review; features: rich factual and procedural knowledge, contextualism, uncertainty, value relativism. <b>SOC</b>: Selection, Optimization, Compensation. Develop by reflecting, multiple perspectives, accepting uncertainty, thinking of consequences, feedback, humility. Self-efficacy asks ‘Can I?’; wisdom asks ‘What should I do?’"],
["6. Strengths & gratitude","<b>VIA (Peterson & Seligman 2004)</b>: <i>Wisdom</i> – creativity, curiosity, judgment, love of learning, perspective; <i>Courage</i> – bravery, perseverance, honesty, zest; <i>Humanity</i> – love, kindness, social intelligence; <i>Justice</i> – teamwork, fairness, leadership; <i>Temperance</i> – forgiveness, humility, prudence, self-regulation; <i>Transcendence</i> – appreciation of beauty, gratitude, hope, humour, spirituality. Strengths ≠ talents, skills, values, traits. Signature strengths feel central/authentic; avoid underuse and overuse. <b>Gratitude</b>: from Latin gratia; Emmons & McCullough – benefit from another that was intentional, costly to giver, valuable to receiver (can also come from non-human events); felt by 90%+ adults; found across Christian, Muslim, Jewish, Hindu traditions; social and moral virtue, motivates reciprocity, linked to life satisfaction. Aristotle: self-sufficient ‘magnanimous’ people may see it as demeaning indebtedness. McCraty & Childre: appreciation vs frustration shows coherent heart rhythms. Benefit-finding: finding gains in a crisis."]],
[
["1. Interventions","Deliberate activity to build positive feelings, behaviours, thoughts (Sin & Lyubomirsky 2009). Examples: gratitude letter/visit, three good things, acts of kindness, using signature strengths in a new way, best possible self, savouring, forgiveness work. Seligman, Steen, Park & Peterson (2005): five exercises vs placebo (early memories) – gratitude visit: largest immediate rise, faded in ~1 month; three good things and using strengths: more happiness, fewer depressive symptoms for 6 months. <b>What makes them work</b> (Lyubomirsky & Layous): dosage and variety, motivation/effort, person–activity fit; routes = positive emotions, thoughts, behaviours, need satisfaction."],
["2. Evidence & critique","Sin & Lyubomirsky: 51 interventions, 4,266 people – r = .29 wellbeing, r = .31 less depression (d ≈ 0.6); stronger when longer, for depressed/older/motivated people. Bolier et al. (2013): 39 randomized studies, 6,139 people – SWB 0.34, psychological 0.20, depression 0.23; gains at 3–6 months. Critique: modest effects, high heterogeneity, variable quality, publication bias, ‘more is not always better’ (continuum), need trials in diverse clinical groups."],
["3. Health","Pathways: <b>biological</b> (lower cortisol), <b>behavioural</b> (activity, diet, no smoking, doctor visits), <b>psychosocial</b> (social ties, coping). MESA study (Hernandez 2015): 5,100+ adults 45–84 – most optimistic had 2× odds of ideal cardiovascular health (BP, BMI, glucose, cholesterol, diet, activity, smoking). Chida & Steptoe 2008: wellbeing predicts lower mortality; Boehm & Kubzansky 2012: optimism protects heart; GRACE (Huffman 2016): optimism/gratitude exercises after acute coronary syndrome; 2024: wellbeing predicts death/rehospitalisation in cardiac patients. We cannot claim raising optimism prevents heart disease, nor that positivity replaces treatment."],
["4. Education","Positive education = academic skills + wellbeing science (Norrish et al. 2013); tools PERMA and VIA. PERMA: Positive emotion, Engagement, Relationships, Meaning, Achievement; PERMAH adds Health. <b>Geelong Grammar School</b> (Australia): whole-school model during Seligman’s six-month visit; students, staff, policies, ethos; schools in PESA grew 9 → 100+ (2011–2020). Classroom: strengths activities, teacher–student bonds, jigsaw cooperative learning, art on flourishing; Winmalee High School (NSW) – PERMAH via project-based learning and anti-bullying. Caution: implementation research still developing."],
["5. Organisations","Positive organisational psychology: positive experiences and traits at work. <b>POB</b> (Luthans 2002) – measurable, developable strengths; <b>POS</b> (Cameron, Dutton, Quinn 2003, Michigan) – dynamics of exceptional performance. <b>PsyCap = HERO</b>: Hope, Efficacy, Resilience, Optimism – state-like, developable, linked to attitudes and performance. Practice: job crafting, PsyCap training, culture of gratitude (2024 study: gratitude countered toxicity via PsyCap), positive leadership. Critics: POS leans positive and may overlook difficulties."],
["6. Clinics, counselling, groups","Why: free of illness ≠ flourishing. <b>Positive psychotherapy</b> (Rashid): symptoms plus strengths, resources, values, hopes; 15-session manual. <b>Well-being therapy</b> (Fava, Ruini): based on Ryff’s six dimensions for depression/anxiety; watch for polarities (too much autonomy). <b>Counselling sequence</b>: rapport & hope → identify strengths → set goals → practise (three good things) → review wellbeing. Individual delivery worked better than group delivery (2009, 2013); <b>support groups</b>: peer connection, gratitude rounds, strengths circles, growth after adversity. Use responsibly: fit with culture, complement not cure, avoid forced positivity, respect small-to-moderate evidence."]]];
